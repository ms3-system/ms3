name: Setup Go service
description: Checkout code and set up Go for one ms3 service
inputs:
  service:
    required: true
    description: Service directory name
runs:
  using: composite
  steps:
    - name: Checkout code
      uses: actions/checkout@v5.1.0

    - name: Setup Go
      uses: actions/setup-go@v5.6.0
      with:
        go-version-file: ${{ inputs.service }}/go.mod
        cache: true
        cache-dependency-path: ${{ inputs.service }}/go.sum
